name: Build LiquidShade APK
on:
  push:
    branches: [liquidshade-oneui9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android packages
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Prepare LiquidShade signing identity
        env:
          LIQUIDSHADE_SIGNING_JKS_B64: ${{ secrets.LIQUIDSHADE_SIGNING_JKS_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/liquidshade.jks"
          if [[ -n "$LIQUIDSHADE_SIGNING_JKS_B64" ]]; then
            printf '%s' "$LIQUIDSHADE_SIGNING_JKS_B64" | base64 --decode > "$key_file"
          else
            keytool -genkeypair -noprompt -storetype JKS -keystore "$key_file" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=LiquidShade CI"
          fi
          echo "LIQUIDSHADE_KEYSTORE=$key_file" >> "$GITHUB_ENV"
      - name: Verify the lens pixel contract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1
          python3 -m venv "$RUNNER_TEMP/optics"
          "$RUNNER_TEMP/optics/bin/pip" install skia-python==144.1 numpy==2.2.6
          "$RUNNER_TEMP/optics/bin/python" tools/verify_lens.py
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify live backdrop, motion and foreground pixels on Android 17
        run: bash tools/verify_live_android.sh
      - name: Verify and stage the signed APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LiquidShade-1.5.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LiquidShade-1.5.0.apk | tee "$RUNNER_TEMP/liquidshade-cert.txt"
          expected=$(keytool -exportcert -keystore "$LIQUIDSHADE_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          actual=$(awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}' "$RUNNER_TEMP/liquidshade-cert.txt")
          test "$actual" = "$expected"
          test "$(unzip -p dist/LiquidShade-1.5.0.apk META-INF/xposed/scope.list)" = com.android.systemui
          cd dist
          sha256sum LiquidShade-1.5.0.apk LiquidShade-1.5.0-native.png > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LiquidShade-1.5.0
          path: dist/
          retention-days: 30
          if-no-files-found: error
