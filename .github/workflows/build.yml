name: Build LiquidNotify signed APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed upgradeable APK
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.LIQUIDNOTIFY_SIGNING }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_BUNDLE" || "$SIGNING_BUNDLE" != *$'\n'* ]]; then
            echo "::error::Set LIQUIDNOTIFY_SIGNING to two lines: password, then Base64 keystore. See SIGNING.md."
            exit 1
          fi
          PASSWORD="${SIGNING_BUNDLE%%$'\n'*}"
          KEYSTORE_BASE64="${SIGNING_BUNDLE#*$'\n'}"
          if [[ -z "$PASSWORD" || -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Invalid LIQUIDNOTIFY_SIGNING secret."
            exit 1
          fi
          echo "::add-mask::$PASSWORD"
          export LIQUIDNOTIFY_KEYSTORE_PATH="$RUNNER_TEMP/liquidnotify-release.jks"
          export LIQUIDNOTIFY_STORE_PASSWORD="$PASSWORD"
          export LIQUIDNOTIFY_KEY_ALIAS="liquidnotify"
          export LIQUIDNOTIFY_KEY_PASSWORD="$PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LIQUIDNOTIFY_KEYSTORE_PATH"
          chmod 600 "$LIQUIDNOTIFY_KEYSTORE_PATH"
          trap 'rm -f "$LIQUIDNOTIFY_KEYSTORE_PATH"' EXIT
          gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidNotify-final-signed-APK
          path: app/build/outputs/apk/release/*.apk
