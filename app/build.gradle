plugins { id 'com.android.application' }

android {
    namespace 'dev.vadinyt.liquidshade'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'dev.vadinyt.liquidshade'
        minSdk 33
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
        testInstrumentationRunner 'dev.vadinyt.liquidshade.GlassInstrumentation'
    }
    signingConfigs {
        debug {
            def ciKey = System.getenv('LIQUIDSHADE_KEYSTORE')
            if (ciKey) {
                storeFile file(ciKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { merges += 'META-INF/xposed/*' } }
}
dependencies { compileOnly 'io.github.libxposed:api:102.0.0' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
